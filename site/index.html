<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório Embarcados</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --soft: #f4f7fa; --ink: #172033; --muted: #5d6a7e; --line: #dbe1ea;
    --accent: #0f8b8d; --accent-ink: #ffffff; --current: #f59e0b;
    --warn: #b54708; --bad: #b42318; --good: #067647; --wire: #9aa5b5;
    --shadow: 0 1px 2px rgba(23,32,51,.06), 0 8px 24px rgba(23,32,51,.06);
    --hero-a: #dff4f2; --hero-b: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1118; --panel: #151c27; --soft: #1b2432; --ink: #e7edf6; --muted: #92a0b5; --line: #263143;
      --accent: #34d1c6; --accent-ink: #06211f; --warn: #f79009; --bad: #f97066; --good: #47cd89; --wire: #55637a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      --hero-a: #123238; --hero-b: #0c1118;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1118; --panel: #151c27; --soft: #1b2432; --ink: #e7edf6; --muted: #92a0b5; --line: #263143;
    --accent: #34d1c6; --accent-ink: #06211f; --warn: #f79009; --bad: #f97066; --good: #47cd89; --wire: #55637a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --hero-a: #123238; --hero-b: #0c1118;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  code { font: 0.9em ui-monospace, Consolas, monospace; background: var(--soft); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  button, select, input { font: inherit; color: inherit; }

  /* topo */
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 22px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: #0b6e75; display: grid; place-items: center; box-shadow: var(--shadow); }
  .logo i { width: 10px; height: 10px; border-radius: 50%; background: #ff5a4f; box-shadow: 0 0 10px 3px #ff5a4f; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; box-shadow: none; } }
  .brand b { display: block; font-size: 16px; letter-spacing: -.01em; line-height: 1.15; }
  .brand small { color: var(--muted); font-size: 12px; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; cursor: pointer; transition: border-color .15s, transform .05s; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 57px); }

  /* menu em trilha */
  nav { border-right: 1px solid var(--line); padding: 18px 14px; background: var(--panel); }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px 8px; }
  .step { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; color: inherit; }
  .step:hover { background: var(--soft); }
  .step.active { background: var(--soft); border-color: var(--accent); }
  .dot { position: relative; flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12px ui-monospace, Consolas, monospace; border: 2px solid var(--line); background: var(--panel); color: var(--muted); }
  .step.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step:not(:last-child) .dot::after { content: ""; position: absolute; top: 100%; left: calc(50% - 1px); width: 2px; height: 24px; background: var(--line); }
  .step.done:not(:last-child) .dot::after { background: var(--accent); }
  .info { min-width: 0; }
  .info b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info small { color: var(--muted); font-size: 12px; display: block; }

  main { padding: 22px; max-width: 1180px; width: 100%; }

  /* herói */
  .hero { border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; margin-bottom: 18px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); }
  .hero-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .num { font: 700 13px ui-monospace, Consolas, monospace; color: var(--accent); }
  .hero h2 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.02em; line-height: 1.15; }
  .hero p { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .chip.board { color: #fff; border: 0; font-weight: 600; }
  .chip.uno { background: #0b6e75; } .chip.pico { background: #c51a4a; } .chip.esp { background: #2563eb; }
  .chip.concept { color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); font-family: ui-monospace, Consolas, monospace; }

  .grid { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 18px; align-items: start; }
  .grid > *, .layout > * { min-width: 0; }
  .layout { grid-template-columns: 270px minmax(0, 1fr); }
  .sticky { position: sticky; top: 76px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* controles */
  .field { margin-bottom: 16px; }
  .field label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; margin-bottom: 6px; }
  .field label .val { font: 600 13px ui-monospace, Consolas, monospace; color: var(--accent); background: var(--soft); padding: 1px 8px; border-radius: 6px; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .field select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); }
  .field select:focus, input:focus-visible, .btn:focus-visible, .tab:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; gap: 8px; align-items: center; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

  /* cálculos */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--soft); border-radius: 12px; padding: 10px 12px; border-left: 3px solid var(--accent); }
  .stat b { display: block; font: 700 19px ui-monospace, Consolas, monospace; letter-spacing: -.02em; }
  .stat span { font-size: 12px; color: var(--muted); }
  .meter { position: relative; height: 12px; border-radius: 999px; overflow: hidden; display: flex; margin-top: 6px; }
  .meter i { display: block; height: 100%; }
  .z-low { background: #f59e0b; } .z-ok { background: #22c55e; } .z-hi { background: #ef4444; }
  .needle-wrap { position: relative; height: 14px; }
  .needle { position: absolute; top: 2px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 10px solid var(--ink); transform: translateX(-7px); transition: left .25s; }
  .ticks { position: relative; height: 16px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .alert { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; border: 1px solid; }
  .alert.good { color: var(--good); border-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--panel)); }
  .alert.warn { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
  .alert.bad { color: var(--bad); border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); }

  /* circuito */
  .stage { background: var(--soft); border-radius: 12px; padding: 6px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--ink); font: 12px system-ui, sans-serif; }
  svg .on-board { fill: #e8fffd; font-weight: 600; }
  svg .pin-n { font-size: 9px; fill: #bfeeea; }
  svg .pin-n.sel { fill: #fbbf24; font-weight: 700; }
  svg .mut { fill: var(--muted); }
  .wire { fill: none; stroke: var(--wire); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .wire.flow { stroke: var(--current); stroke-width: 4; stroke-dasharray: 3 11; animation: flow .45s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .statebar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .pill { font: 600 12px ui-monospace, Consolas, monospace; padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
  .pill.high { color: #92400e; background: #fef3c7; border-color: #f59e0b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.high { color: #fcd34d; background: #3a2a07; } }
  :root[data-theme="dark"] .pill.high { color: #fcd34d; background: #3a2a07; }

  /* terminal */
  .term { border-radius: 12px; overflow: hidden; border: 1px solid #263143; background: #0b0f16; }
  .term-bar { display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: #151c27; color: #8b97ab; font: 12px ui-monospace, Consolas, monospace; }
  .term-bar i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; } .term-bar i:nth-child(2) { background: #febc2e; } .term-bar i:nth-child(3) { background: #28c840; }
  .term-bar span { margin-left: 8px; }
  .serial { color: #8fe3a3; font: 13px/1.5 ui-monospace, Consolas, monospace; padding: 10px 12px; height: 140px; overflow: auto; white-space: pre; }
  .serial em { color: #5f6c82; font-style: normal; }

  /* código */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { border: 1px solid var(--line); background: var(--soft); border-radius: 10px 10px 0 0; padding: 6px 12px; cursor: pointer; font: 13px ui-monospace, Consolas, monospace; color: var(--muted); }
  .tab.active { background: #0f1722; color: #e6eef9; border-color: #0f1722; }
  pre { margin: 0; background: #0f1722; color: #d6e2f0; border-radius: 0 12px 12px 12px; padding: 16px; overflow: auto; max-height: 420px; font: 13px/1.6 ui-monospace, Consolas, monospace; tab-size: 2; }
  .t-com { color: #6b7a90; font-style: italic; } .t-str { color: #a5e075; } .t-pre { color: #c792ea; }
  .t-kw { color: #ff9f6e; } .t-fn { color: #6cb6ff; } .t-num { color: #f9c859; } .t-key { color: #6cb6ff; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .ok-msg { color: var(--good); font-size: 13px; }
  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  /* estudo */
  ul.clean { margin: 0; padding: 0; list-style: none; }
  ul.clean li { position: relative; padding: 8px 0 8px 26px; border-top: 1px solid var(--line); }
  ul.clean li:first-child { border-top: 0; }
  ul.clean li::before { content: "▸"; position: absolute; left: 6px; color: var(--accent); }
  details { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--soft); }
  summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--accent); font-weight: 700; }
  details[open] summary::after { content: "–"; }
  details p { margin: 8px 0 0; color: var(--muted); }
  .pending { text-align: center; color: var(--muted); padding: 48px 12px; }
  .pending .big { font-size: 40px; }

  .tag { font: 600 10px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
  .statebar { flex-wrap: wrap; }
  .mutetxt { color: var(--muted); font-size: 13px; }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .wire.flow.blue { stroke: #60a5fa; }
  .btn.primary { touch-action: manipulation; user-select: none; }
  a.btn { text-decoration: none; color: inherit; display: inline-block; }
  a.btn.primary { color: var(--accent-ink); }
  .brand { text-decoration: none; color: inherit; }
  nav .navh { margin: 16px 0 6px 8px; }
  .step.plain .dot::after { display: none !important; }
  .dot.b-uno { background: #0b6e75; border-color: #0b6e75; color: #fff; }
  .dot.b-pico { background: #c51a4a; border-color: #c51a4a; color: #fff; }
  .dot.b-esp { background: #2563eb; border-color: #2563eb; color: #fff; }

  .hero.big { padding: 34px 30px; }
  .hero.big h2 { font-size: 36px; max-width: 22ch; }
  .hero.big p { font-size: 17px; max-width: 62ch; }
  .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .cta .btn { padding: 10px 18px; font-size: 15px; }
  .hero.board { display: grid; grid-template-columns: 1fr minmax(240px, 340px); gap: 20px; align-items: center; }
  .hero-art svg { max-height: 200px; }
  .crumb { font-size: 13px; color: var(--muted); text-decoration: none; }
  .crumb:hover { color: var(--accent); }
  h3.sec { font-size: 22px; letter-spacing: -.01em; margin: 34px 0 6px; scroll-margin-top: 76px; }
  .lead { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }

  .bcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
  .bcard { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .bcard:hover { transform: translateY(-3px); border-color: var(--accent); }
  .bart { background: var(--soft); padding: 14px 18px 4px; }
  .bbody { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .bbody h3 { margin: 4px 0 0; font-size: 18px; letter-spacing: -.01em; line-height: 1.25; }
  .bbody p { margin: 0; color: var(--muted); font-size: 14px; }
  .bbody .chip.board { align-self: flex-start; padding: 2px 12px; }
  .more { margin-top: auto; padding-top: 8px; color: var(--accent); font-weight: 600; font-size: 14px; }

  .tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
  .tbl { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
  .tbl th, .tbl td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl thead th { background: var(--soft); font-size: 13px; }
  .tbl tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tbl tbody tr:last-child th, .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl td:nth-child(2) { border-left: 1px solid var(--line); }

  .flow { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .fstep { flex: 1 1 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .fstep b { display: block; margin-bottom: 4px; }
  .fstep span { color: var(--muted); font-size: 14px; }
  .farrow { align-self: center; font-size: 22px; color: var(--accent); }

  .trail { display: flex; flex-direction: column; gap: 8px; }
  .trow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; text-decoration: none; color: inherit; }
  .card .trow { background: var(--soft); }
  .trow:hover { border-color: var(--accent); }
  .trow .num { font: 700 14px ui-monospace, Consolas, monospace; color: var(--accent); min-width: 24px; }
  .trow .ttl { flex: 1 1 220px; min-width: 0; }
  .trow .ttl b { display: block; }
  .trow .ttl small { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--good); border-color: var(--good); }
  .badge.criado { color: var(--warn); border-color: var(--warn); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .prose { margin: 0 0 12px; max-width: 78ch; }
  .prose:last-child { margin-bottom: 0; }
  dl.specs { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; margin: 0; }
  dl.specs dt, dl.specs dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); }
  dl.specs dt:first-of-type, dl.specs dt:first-of-type + dd { border-top: 0; }
  dl.specs dt { color: var(--muted); font-size: 14px; padding-right: 10px; }
  dl.specs dd { font-weight: 500; }
  .callout { border-left: 4px solid var(--warn); }
  ul.clean.warn li::before { content: "!"; font-weight: 800; color: var(--warn); }
  ul.clean.good li::before { content: "+"; font-weight: 800; color: var(--good); }
  ul.clean.bad li::before { content: "–"; font-weight: 800; color: var(--bad); }
  .blk { margin-bottom: 14px; }
  .blk:last-child { margin-bottom: 0; }
  .blkhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .blk pre { border-radius: 12px; max-height: 220px; }
  @media (max-width: 900px) {
    nav .navh { display: none; }
    .hero.board { grid-template-columns: 1fr; }
    .hero.big h2 { font-size: 28px; }
    .farrow { display: none; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav { border-right: 0; border-bottom: 1px solid var(--line); }
    #menu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .step { flex: none; width: auto; min-width: 150px; }
    .step .dot::after { display: none !important; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .sticky { position: static; }
    main { padding: 16px; }
    .hero h2 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .logo i, .wire.flow { animation: none; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/" title="Página inicial"><div class="logo"><i></i></div><div><b>Laboratório Embarcados</b><small>Arduino · Pico · ESP32 simulados no Wokwi</small></div></a>
  <button class="btn" id="themeBtn" title="Alternar tema claro/escuro">◐ Tema</button>
</header>
<div class="layout">
  <nav><div id="menu"></div></nav>
  <main id="view"></main>
</div>

<script>
/* ======================================================================
   Para adicionar um projeto novo: inclua um objeto em PROJECTS.
   Campos: id, slug (nome da pasta), title, board, status ('ok' | 'pendente'),
   summary, concepts[], e (se interativo) params[], defaults, derive(p),
   files(p), draw(p, on, d), wave(p, d), experiments[], quiz[].
   ====================================================================== */

const LED_COLORS = {
  red:    { label: 'vermelho', vf: 2.0, css: '#ff3b30' },
  green:  { label: 'verde',    vf: 2.1, css: '#22c55e' },
  yellow: { label: 'amarelo',  vf: 2.1, css: '#facc15' },
  blue:   { label: 'azul',     vf: 3.0, css: '#3b82f6' },
  white:  { label: 'branco',   vf: 3.0, css: '#e5e9f2' }
};
const RESISTORS = [10, 47, 100, 220, 330, 470, 1000, 4700, 10000, 100000];
const BAND_COLORS = ['#111', '#7b4a1e', '#d92b2b', '#f57c1f', '#f2d21b', '#2f9e44', '#2b6fd9', '#8b3fc4', '#8c8c8c', '#f5f5f5'];
const fmtOhm = r => r >= 1000 ? (r / 1000).toString().replace('.', ',') + ' kΩ' : r + ' Ω';
const ohmAscii = r => r >= 1000 ? (r / 1000) + " kohms" : r + " ohms";
const VCC = 5;
const DIGITAL_PINS = [13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2];

function bands(r) {
  const s = String(r);
  const d1 = Number(s[0]), d2 = Number(s[1] || 0), mult = Math.max(0, s.length - 2);
  return [d1, d2, mult];
}

const PWM_PINS = [3, 5, 6, 9, 10, 11];
/* Converte a leitura do ADC (0-1023) em PWM (0-255), igual ao código gerado. */
function pwmFor(curve, adc) {
  return curve === 'gamma' ? Math.floor(Math.pow(adc / 1023, 2.2) * 255 + 0.5) : Math.floor(adc * 255 / 1023);
}

      };
      const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

          st.led = !st.led; st.detected++;
          log(`Pressao #${st.detected} -> LED ${st.led ? 'ligado' : 'desligado'}`);
        }
        render();
      };
      const play = res => { st.last = res; res.acc.forEach(e => timers.push(setTimeout(() => apply(e), e.t))); render(); };
      const press = () => { if (st.pressed) return; st.pressed = true; st.clicks++; play(simulateEdge(params, 'press', Math.random)); };
      const release = () => { if (!st.pressed) return; st.pressed = false; play(simulateEdge(params, 'release', Math.random)); };
      const quick = () => { if (st.pressed) return; press(); timers.push(setTimeout(release, 150)); };
      const batch = () => {
        const n = 10; let led = false, det = 0;
        for (let i = 0; i < n; i++) for (const dir of ['press', 'release']) {
          const res = simulateEdge(params, dir, Math.random);
          if (params.mode === 'hold') { const lastAcc = res.acc[res.acc.length - 1]; if (lastAcc) led = lastAcc.v === 0; det += res.acc.filter(e => e.v === 0).length; }
          else res.acc.forEach(e => { if (e.v === 0) { led = !led; det++; } });
        }
        const expected = params.mode === 'hold' ? false : n % 2 === 1;
        const ok = led === expected && det === n;

      };
      const reset = () => {
        clearTimers(); Object.assign(st, { pressed: false, led: false, clicks: 0, detected: 0, last: null });
        t0 = performance.now();
        lines = params.serial ? [stamp(0, 'Pronto! Aperte o botao.')] : [];
        showSerial(params.serial ? lines : null);
        const b = $('#batchOut'); if (b) b.innerHTML = '';

          h.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
          h.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
          window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
          cleanup.push(() => { window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); });

const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* realce de sintaxe simples */
const RULES = {
  cpp:  { re: /(\/\/.*)|("(?:[^"\\]|\\.)*")|(#include\s*<[^>]+>)|\b(const|void|bool|unsigned|long|uint8_t|if|true|false|HIGH|LOW|OUTPUT)\b|\b(pinMode|digitalWrite|delay|millis|begin|println)\b|\b(\d+)\b/g,
          cls: ['t-com', 't-str', 't-pre', 't-kw', 't-fn', 't-num'] },
  json: { re: /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+\b)/g,
          cls: ['t-str', '', 't-kw', 't-num'] },
  ini:  { re: /(^\[.*\]$)|(^\w+)(?=\s*=)|('[^']*'|"[^"]*")|(\b\d+\b)/gm,
          cls: ['t-pre', 't-key', 't-str', 't-num'] }
};
function highlight(text, lang) {
  const rule = RULES[lang === 'toml' ? 'ini' : lang];
  const re = new RegExp(rule.re.source, rule.re.flags);
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (m[0] === '') { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index));
    if (lang === 'json' && m[1] !== undefined && m[2] !== undefined) {
      out += `<span class="t-key">${esc(m[1])}</span>${esc(m[2])}`;
    } else {
      let cls = '';
      for (let i = 1; i < m.length; i++) if (m[i] !== undefined) { cls = rule.cls[i - 1]; break; }
      out += `<span class="${cls}">${esc(m[0])}</span>`;
    }
    last = re.lastIndex;
  }
  return out + esc(text.slice(last));
}

function renderMenu() {
  const boards = Object.values(BOARDS).map(b => `
    <button class="step plain ${current === 'placa/' + b.id ? 'active' : ''}" data-href="#/placa/${b.id}">
      <span class="dot b-${b.cls}">${b.letter}</span>
      <span class="info"><b>${b.short}</b><small>${b.mcu}</small></span>
    </button>`).join('');
  const projects = PROJECTS.map(p => `
    <button class="step ${p.status === 'ok' ? 'done' : ''} ${p.id === current ? 'active' : ''}" data-href="#/projeto/${p.id}">
      <span class="dot">${p.status === 'ok' ? '✓' : p.id}</span>
      <span class="info"><b>${p.title}</b><small>${p.board}${STATUS_TXT[p.status]}</small></span>
    </button>`).join('');
  $('#menu').innerHTML = `
    <button class="step plain ${current === 'home' ? 'active' : ''}" data-href="#/"><span class="dot">⌂</span><span class="info"><b>Início</b><small>Visão geral e placas</small></span></button>
    <h2 class="navh">Placas</h2>${boards}
    <h2 class="navh">Trilha de projetos</h2>${projects}`;
  document.querySelectorAll('.step').forEach(b => b.onclick = () => { location.hash = b.dataset.href; });
}
const STATUS_TXT = { ok: '', criado: ' · a testar', pendente: ' · em breve' };

function leaveView() { if (sim) { sim.stop(); sim = null; } proj = null; }

function route() {
  const [kind, id] = location.hash.replace(/^#\/?/, '').split('/');
  leaveView();
  if (kind === 'placa' && BOARDS[id]) { current = 'placa/' + id; renderMenu(); showBoard(BOARDS[id]); }
  else if (kind === 'projeto' && PROJECTS.some(p => p.id === id)) { current = id; openProject(); }
  else { current = 'home'; renderMenu(); showHome(); }
  window.scrollTo({ top: 0 });
}

function statusBadge(p) {
  const t = p.status === 'ok' ? 'testado' : p.status === 'criado' ? 'a testar' : 'em breve';
  return `<span class="badge ${p.status}">${t}</span>`;
}

    <div class="card"><h3>Configuração no PlatformIO e no Wokwi</h3>
      <p class="note" style="margin-top:0">${b.config.note}</p>
      ${blocks.map((x, i) => `<div class="blk"><div class="blkhead"><code>${x[0]}</code><button class="btn" data-blk="${i}">Copiar</button></div><pre>${highlight(x[2], x[1])}</pre></div>`).join('')}
    </div>

    <div class="card"><h3>Projetos desta placa</h3><div class="trail">${related}</div></div>`;
  document.querySelectorAll('[data-blk]').forEach(btn => btn.onclick = async () => {
    try { await navigator.clipboard.writeText(boardBlocks[Number(btn.dataset.blk)]); btn.textContent = 'Copiado!'; } catch (e) { btn.textContent = 'Use Ctrl+C'; }
    setTimeout(() => btn.textContent = 'Copiar', 1500);
  });
}
let boardBlocks = [];

function heroHtml(p) {
  return `<section class="hero">
    <div class="hero-top"><span class="num">PROJETO ${p.id}</span><span class="chip board ${p.boardClass}">${p.board}</span><span class="chip">pasta: ${p.slug}</span></div>
    <h2>${p.title}</h2><p>${p.summary}</p>
    <div class="chips">${p.concepts.map(c => `<span class="chip concept">${c}</span>`).join('')}</div></section>`;
}

/* ---------- auxiliares de simulação ---------- */
function stamp(ms, text) { return `<em>[${String(Math.round(ms)).padStart(6, ' ')} ms]</em> ${text}`; }
function showSerial(lines) {
  const box = $('#serial'); if (!box) return;
  box.innerHTML = lines ? lines.join('\n') : '<em>(Serial desativado no código)</em>';
  box.scrollTop = box.scrollHeight;
}
function setPill(text, high) { const s = $('#state'); if (!s) return; s.textContent = text; s.className = 'pill' + (high ? ' high' : ''); }
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function stepPath(v0, trans, yH, yL, x, W) {
  let d = `M${x(0)} ${v0 ? yH : yL}`, cur = v0;
  for (const e of trans) { d += ` H${x(e.t)}`; if (e.v !== cur) { d += ` V${e.v ? yH : yL}`; cur = e.v; } }
  return d + ` H${x(W)}`;
}

/* Simula um aperto ou uma soltura de botão com bounce e o filtro de debounce do código gerado. */
function simulateEdge(p, dir, rnd) {
  const from = dir === 'press' ? 1 : 0, to = 1 - from, deb = p.debounce, start = 1;
  const raw = [{ t: start, v: to }];
  if (p.bounce > 0) {
    const pairs = 1 + Math.floor(rnd() * 3), times = [];
    for (let i = 0; i < pairs * 2; i++) times.push(start + 0.2 + rnd() * p.bounce);
    times.sort((a, b) => a - b);
    times.forEach((t, i) => raw.push({ t, v: i % 2 === 0 ? from : to }));
  }
  const lastRaw = raw[raw.length - 1].t, W = lastRaw + deb + 8;
  const rawAt = t => { let v = from; for (const e of raw) { if (e.t <= t) v = e.v; else break; } return v; };
  let ant = from, est = from, ultima = 0; const acc = [];
  for (let t = 0; t <= W; t += 0.2) {
    const m = Math.floor(t), lei = rawAt(t);
    if (lei !== ant) { ant = lei; ultima = m; }
    if (m - ultima >= deb && lei !== est) { est = lei; acc.push({ t, v: est }); }
  }
  return { dir, from, to, raw, acc, W, lastRaw };
}

/* ---------- projeto ---------- */
let proj = null, sim = null;
const METER_HTML = `
  <div style="font-size:12px;color:var(--muted)">Corrente no LED</div>
  <div class="meter"><i class="z-low" style="width:12.5%"></i><i class="z-ok" style="width:37.5%"></i><i class="z-hi" style="width:50%"></i></div>
  <div class="needle-wrap"><div class="needle" id="needle"></div></div>
  <div class="ticks"><span style="left:0;transform:none">0</span><span style="left:12.5%">5</span><span style="left:50%">20</span><span style="right:0;transform:none">40 mA</span></div>`;

function openProject() {
  if (sim) { sim.stop(); sim = null; }
  renderMenu();
  proj = PROJECTS.find(p => p.id === current);
  if (!proj.params) { renderPending(proj); return; }
  params = Object.assign({}, proj.defaults, store.get('lab.params.' + proj.id) || {});
  activeTab = 0;

  $('#view').innerHTML = heroHtml(proj) + `
    <div class="grid">
      <div class="sticky">
        <div class="card"><h3>Parâmetros</h3><div id="controls"></div>
          <button class="btn" id="reset">↺ Restaurar padrões</button></div>
        <div class="card"><h3>Cálculos</h3><div class="stats" id="stats"></div>${proj.meter ? METER_HTML : ''}<div id="alert"></div></div>
      </div>
      <div>
        <div class="card"><h3>Circuito <span class="pill" id="state"></span></h3>
          <div class="stage" id="circuit"></div><div class="statebar" id="actions"></div></div>
        <div class="card"><h3>${proj.waveTitle}</h3><div class="stage" id="wave"></div></div>
        <div class="card"><h3>Monitor serial (simulado)</h3>
          <div class="term"><div class="term-bar"><i></i><i></i><i></i><span>Serial · 9600 baud</span></div><div class="serial" id="serial"></div></div></div>
      </div>
    </div>
    <div class="card"><h3>Arquivos para a pasta ${proj.slug}</h3>
      <div class="tabs" id="tabs"></div><pre id="code"></pre>
      <div class="actions"><button class="btn primary" id="copy">Copiar arquivo</button><button class="btn" id="download">Baixar arquivo</button>
      <span class="ok-msg" id="copied"></span></div>
      <p class="note">Cole cada arquivo na pasta do projeto e recompile (<code>Ctrl+Alt+B</code>). Mudou algum pino, resistor ou cor? Atualize também o <code>diagram.json</code>.</p></div>
    <div class="grid">
      <div class="card"><h3>Experimentos</h3><ul class="clean">${proj.experiments.map(c => `<li>${c}</li>`).join('')}</ul></div>
      <div class="card"><h3>Perguntas de verificação</h3>${proj.quiz.map(q => `<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div>
    </div>`;

  buildControls();
  $('#reset').onclick = () => { params = Object.assign({}, proj.defaults); store.set('lab.params.' + proj.id, params); buildControls(); update(); };
  $('#copy').onclick = async () => {
    try { await navigator.clipboard.writeText(files[activeTab].text); $('#copied').textContent = 'Copiado!'; }
    catch (e) { $('#copied').textContent = 'Selecione o texto e use Ctrl+C.'; }
    setTimeout(() => $('#copied').textContent = '', 1800);
  };
  $('#download').onclick = () => {
    const f = files[activeTab]; const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([f.text], { type: 'text/plain' }));
    a.download = f.name.split('/').pop(); a.click(); URL.revokeObjectURL(a.href);
  };
  sim = proj.createSim();
  $('#actions').innerHTML = sim.actionsHtml;
  sim.bind();
  update();
}

function renderPending(p) {
  $('#view').innerHTML = heroHtml(p) + `
    <div class="card pending"><div class="big">🛠️</div><p><b>Projeto ainda não criado.</b></p>
    <p>Peça ao Claude: “vamos para o ${p.id}”. Ele gera o projeto e acrescenta a página interativa aqui.</p></div>`;
}

function buildControls() {
  $('#controls').innerHTML = proj.params.map(d => {
    const v = params[d.key];
    let input;
    if (d.type === 'range') input = `<input type="range" id="p_${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}">`;
    else if (d.type === 'select') input = `<select id="p_${d.key}">${d.options.map(o => `<option value="${o.v}" ${String(o.v) === String(v) ? 'selected' : ''}>${o.t}</option>`).join('')}</select>`;
    else input = `<span class="check"><input type="checkbox" id="p_${d.key}" ${v ? 'checked' : ''}> ativar</span>`;
    return `<div class="field"><label for="p_${d.key}"><span>${d.label}${d.simOnly ? ' <span class="tag">só simulação</span>' : ''}</span>${d.type === 'range' ? `<span class="val" id="v_${d.key}">${v}${d.unit}</span>` : ''}</label>${input}${d.hint ? `<div class="hint">${d.hint}</div>` : ''}</div>`;
  }).join('');
  proj.params.forEach(d => {
    const el = $('#p_' + d.key);
    el.oninput = el.onchange = () => {
      let v = d.type === 'check' ? el.checked : el.value;
      if (d.type === 'range') { v = Number(v); $('#v_' + d.key).textContent = v + d.unit; }
      else if (d.type === 'select' && !isNaN(Number(v))) v = Number(v);
      params[d.key] = v; store.set('lab.params.' + proj.id, params); update(d.key);
    };
  });
}

function renderCode() {
  $('#tabs').innerHTML = files.map((f, i) => `<button class="tab ${i === activeTab ? 'active' : ''}" data-i="${i}">${f.name}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { activeTab = Number(b.dataset.i); renderCode(); });
  $('#code').innerHTML = highlight(files[activeTab].text, files[activeTab].lang);
}

function update(key) {
  const d = proj.derive(params);
  $('#stats').innerHTML = d.stats.map(s => `<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  if (proj.meter) $('#needle').style.left = Math.min(d.i, 40) / 40 * 100 + '%';
  $('#alert').innerHTML = `<div class="alert ${d.level}">${d.msg}</div>`;
  files = proj.files(params);
  renderCode();
  sim.onParams(key);
}

/* Altera um parâmetro por código (ex.: arrastar o potenciômetro) e mantém os controles sincronizados. */
function setParam(key, v) {
  if (v === null || v === undefined) return;
  params[key] = v;
  const el = $('#p_' + key); if (el) el.value = v;
  const lab = $('#v_' + key), d = proj.params.find(x => x.key === key);
  if (lab && d) lab.textContent = v + (d.unit || '');
  store.set('lab.params.' + proj.id, params);
  update(key);
}

window.addEventListener('hashchange', route);
route();
</script>
